<div class="page-card">
    <div class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Liste des catégories pour la saison en cours
            </h1>
            <div class="page-header-actions">
                <button type="button" id="btnPdf" class="btn btn-primary">
                    Télécharger le tableau en PDF
                </button>
            </div>
        </div>
    </div>

    <div class="page-body page-body-categories">
        <div id="pdfContent">
            <table>
                <thead>
                <tr>
                    <th style="width:100px; text-align:left"> Code</th>
                    <th style="width:200px; text-align:left"> Catégorie</th>
                    <th style="width:150px; text-align:center"> Âge entre</th>
                    <th style="width:150px; text-align:center" class="masquer"> Né(e) entre</th>
                    <th style="width:150px; text-align:left" class="masquer"> Distance maximale</th>
                </tr>
                </thead>
                <tbody id="lesLignes"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modèle d'une ligne catégorie -->
<template id="modeleLigne">
    <tr>
        <td class="col-code"></td>
        <td class="col-nom"></td>
        <td class="col-age" style="text-align:center"></td>
        <td class="col-annee masquer" style="text-align:center"></td>
        <td class="col-distance masquer" style="text-align:left"></td>
    </tr>
</template>
