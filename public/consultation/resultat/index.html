<style>
  /* Toutes les règles commencent par #pageResultat :
     elles ne s'appliquent qu'à cette partie de la page, pas au menu ni à la bannière.
     La couleur rouge (#dc3545) est celle utilisée sur le reste du site. */

  /* Le titre de la carte (le h2) */
  #pageResultat h2 {
    margin: 0 0 20px;
    padding-bottom: 8px;
    border-bottom: 2px solid #dc3545;   /* trait rouge sous le titre */
    font-size: 1.45rem;
    color: #222;
  }

  /* La liste des coureurs trouvés : on peut cliquer sur chaque ligne */
  #pageResultat #listeCoureurs {
    max-height: 260px;      /* hauteur maximum, ensuite on fait défiler */
    overflow-y: auto;
  }

  #pageResultat #listeCoureurs .list-group-item {
    cursor: pointer;        /* le curseur devient une petite main */
  }

  /* Quand la souris passe sur un coureur : fond rouge clair */
  #pageResultat #listeCoureurs .list-group-item:hover {
    background: #fff0f0;
  }

  /* L'en-tête du tableau des résultats */
  #pageResultat th {
    background: #fff0f0;    /* rouge très clair */
    white-space: nowrap;    /* on garde chaque titre sur une seule ligne */
  }

  /* Sur petit écran, le tableau peut défiler vers la droite */
  #pageResultat #resultatsCoureur {
    overflow-x: auto;
  }
</style>

<!-- Le cadre commun à toutes les pages du site -->
<div class="page-card">

  <!-- L'en-tête de la page (le même que les autres pages) -->
  <header class="page-header">
    <div class="page-header-top">
      <h1 class="page-title">
        Courses des 4 saisons Amiens métropole <br>
      </h1>
      4 éditions par an depuis 1983
    </div>
  </header>

  <div class="page-body">

    <!-- Cette balise affiche le menu horizontal (lu dans config/menuhorizontal.json) -->
    <menu></menu>

    <div id="pageResultat">

      <h2>Résultats d'un coureur</h2>

      <!-- Le champ où on tape les premières lettres du nom -->
      <label for="rechercheNom" class="form-label">
        Saisissez les premières lettres du nom
      </label>
      <input type="text"
             id="rechercheNom"
             class="form-control"
             placeholder="Ex. : Dup..."
             autocomplete="off">

      <!-- La liste des coureurs trouvés (remplie par index.js) -->
      <ul id="listeCoureurs" class="list-group mt-2"></ul>

      <!-- Le tableau des résultats du coureur choisi (rempli par index.js) -->
      <div id="resultatsCoureur" class="mt-3"></div>

    </div>
  </div>
</div>
